[package]
name = "pos_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = "0.7.5"
sqlx = { version = "0.7.4", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0"
futures = "0.3"
jsonwebtoken = "9"
argon2 = "0.5"
password-hash = "0.5"
