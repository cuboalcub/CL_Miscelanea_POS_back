services:
  db:
    image: postgres:16-alpine
    container_name: cl_miscelanea_pos_db
    restart: always
    environment:
      POSTGRES_DB: cl_miscelanea_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cl_miscelanea_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: felipeverar/cl-miscelanea-pos-back:latest
    build: .
    container_name: cl_miscelanea_pos_backend
    restart: always
    ports:
      - "8082:8081"
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cl_miscelanea_pos
      JWT_SECRET: cl_miscelanea_pos_jwt_secret_super_seguro_2026
      JWT_EXPIRATION_HOURS: 24
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
