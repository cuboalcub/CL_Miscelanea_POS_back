version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cl_miscelanea_pos_db
    restart: always
    environment:
      POSTGRES_DB: cl_miscelanea_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cl_miscelanea_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
